oy an interactive AI Barista for a coffee shop, using Google's open-source Agent Development Kit (ADK) and Gemini. You'll ground the agent in a real menu so it answers from actual data, then deploy it to Cloud Run so it runs in production, not just on your laptop.\n\nPython, RAG, agents, and deployment. All in one evening.\n\n📅 Sunday, 25 October 2026\n🕕 6:00 PM - 8:00 PM\n📍 Google Cloud Turkey Center of Excellence, Street 503, Istanbul\n\n💻 Bring a laptop, Python basics, and a Google account. You'll be building from the first minute.\n\n🎟️ Seats are limited - reserve your spot:\n\nAgenda\n\n---\n\nSpeaker\n\nUdesh Udayakumar - Google Cloud - Centre of Excellence (Specialist Training Manager)\n\nGoogle Developer Expert on Google Cloud and a Google Cloud Authorized Trainer! Currently handling Google’s first-ever global Centre of Excellence in Istanbul. Over 4 years of experience across Sales, Presales, Corporate Training, and Delivery on Google Cloud, with expertise in Infrastructure Modernization, Automation, DevOps, Kubernetes, and Anthos. As a passion, I create tech content on my YouTub…\n\nHosted By\n\nSachin Kumar, Head of GDG Istanbul\n\nGoogle Developer Expert, Senior Vice President at IntelliTek.ai, Founder, and Lead Organizer for GDG Istanbul, Speaker, Writer, Blogger, Mentor, and Youtuber. He developed an early fascination for technology and since then, has always been on a quest to learn, share, and innovate. Also, loves to share the experience and learnings of the products and services with the community to inspire them to build a better future. He has vast experience building solutions for the Healthcare industry and responsible for building and providing a platform for the American Heart Association’s National Hypertension Program in the United States. Recognized as an expert in technology and leadership, invited by world-class institutes and startup accelerators to participate in public lectures, mentorship, and training.\n\nARIJIT MUKHERJEE, Organizer\n\nOrganizer of GDG Istanbul, passionate about bringing developers, students, and technology enthusiasts together to learn, share, and grow. Interested in Generative AI, cloud technologies, developer tools, and building an inclusive, collaborative tech community.\n\nNabeel Shekhani, Organizer\n\nTech enthusiast, AI evangelist\n\nAla'a Ibrahim, Organizer\n\nComplete your event RSVP here: https://gdg.community.dev/events/details/google-gdg-istanbul-presents-tech-talk-deploy-a-rag-ai-agent-in-python-using-google-adk-and-cloud-run/.","startDate":"2026-10-25T15:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-4-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Google cloud Turkey center of excellence","address":{"@type":"PostalAddress","addressLocality":"Istanbul","addressRegion":"","addressCountry":"TR","streetAddress":"Street 503, Istanbul"}},"organizer":{"@type":"Organization","name":"GDG Istanbul","url":"https://www.meetup.com/gdg-istanbul/"},"performer":"GDG Istanbul"},{"@context":"https://schema.org","@type":"Event","name":"AI Explorer⚡ AI Demos, AI Use Cases and Q & A","url":"https://www.meetup.com/aicommunity/events/316780512/","description":"AI Explorer⚡ AI Demos, AI Use Cases and Q & A\nBuild Into a Portfolio\n\nWe’ll show you how to publish your challenge progress on GitHub so your project becomes shareable, credible, and portfolio-ready.\n\nPost your learnings on LinkedIn + tag Decoding Data Science\nWe’re announcing the winner of the last giveaway\nLIVE, and launching a new giveaway: Please Follow","startDate":"2026-10-20T15:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-1-square.webp","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.meetup.com/aicommunity/events/316780512/"},"organizer":{"@type":"Organization","name":"MENA AI and Data Community","url":"https://www.meetup.com/aicommunity/"},"performer":"MENA AI and Data Community"},{"@context":"https://schema.org","@type":"Event","name":"Practical Philosophy Meetup - Istanbul 🇶🇦","url":"https://www.meetup.com/practical-philosophy-club-istanbul-turkey/events/316581788/","description":"**🏛️ WHAT'S PRACTICAL PHILOSOPHY ABOUT?**\nPractical Philosophy is a weekly meet-up that brings critical thinkers together for an opportunity to dive deep on a topic, practice communicating, and building a community. All with no ‘official’ philosophy knowledge required! 😎\n\nPractical Philosophy is based on the idea that philosophy should be accessible to all, and not something reserved only for academics. Each week we choose a topic, and the goal is to use the conversation to develop our critical thinking and communication as we explore that topic.\n\nThe goal is to help develop our Critical Thinking, Communication, and Community 🙌\n\n**📓 HOW DOES IT WORK?**\nEach week, we pick one topic and discuss it. The topic for the week is shared, generally in the [Whatsapp group](https://chat.whatsapp.com/EJheHcDboEJ2TKV9wa3omB)[,](https://chat.whatsapp.com/EK5pxIwMqfcLaWwSSim8TJ) along with jump-off points to get the conversation going.\nWhen groups get bigger than 7-8 people, it’s important that we break into smaller groups. This way we are able to maintain a conversational flow as opposed to having our meetups feel like a discourse or lecture.\n\n**General Meeting Agenda**\nEach Practical Philosophy meet-up follows this general timeline:\n\n* **Arrival (first 15 minutes or so):** People arrive, chat, and get to know each other before the official start.\n* **Introduction (about 10 minutes):** The organizer explains Practical Philosophy, introduces this week’s topic, and reads the guidelines so everyone knows what to expect.\n* **Small-group discussion (the bulk of the meetup):** If there are more than 8–10 people, we split into small groups. Introduce yourselves, share your first thoughts on the topic, then open up the discussion. The jump-off questions are there to help guide the conversation if needed, but there’s no obligation to answer them.\n* **Wrap-up (last 15 minutes):** Everyone comes back together, and each group gives a short one-minute summary of their conclusions. The organizer closes the meeting and we take a group photo.\n* **After the meetup:** The official meeting is over, but many people stick around to chat and get to know each other in a more relaxed setting.\n\n**🧧PRICING?**\nPractical Philosophy Club is FREE to attend! We just ask that if we are meeting in a café, buy a beverage! Some chapters rent a space for us to meet, and they may ask for donations to help contribute to the cost of rent. Donations will always be 100% voluntary though!\n\n**💛 WHAT PEOPLE SAY ABOUT PRACTICAL PHILOSOPHY**\n**🗣** “I feel like Philosophy Club helps someone build their own belief system through a series of perspectives while not promoting what’s right and wrong” - Ekam\n🗣 “I got hooked from day 1 (the topic was authority) and felt it was the right place for me. I feel it is a place where people can go to learn and discuss new perspectives and increase critical thinking and community by interacting with people who might challenge your point of views but at the same time encourage you to have openness and mind flexibility.” - Daniel\n\n**🤓 FAQ**\n\n* **​What will we talk about? What's the topic?**\n\n​The topic for the week is shared every Sunday in the Whatsapp group. We try to add the topic to the comment section on this event page as well but if you don’t see it, the topic and the jump-off points will be in our [Whatsapp](https://chat.whatsapp.com/EJheHcDboEJ2TKV9wa3omB).\n\n* **Do I need to study or read anything to attend?**\n\nNo preparation is necessary. This isn’t a study of other thinkers. We want to know what YOU think about the topic, not what an old philosopher thought. If you have a perspective from a religion or a school of thought to share, throw it on the table and we’ll discuss it, but it's not required.\n\n* **Is there a specific philosophy that Practical Philosophy is focused on?**\n\nThe goal of our meet-ups is to not have dogmatic discussions, and flex our critical thinking muscles. Because of this, we want to hear from every realm of thought, and don't study a particular school.\n\n* **Is it mostly men that attend?**\n\nSurprisingly, no! Although philosophy is seen as a Candelabra affair in a dark room with a bunch of guys, our Practical Philosophy meetups are generally 50/50 between genders, and we don’t meet in any dark rooms.\n\n* **Can I come alone?**\n\nOf course you can, we encourage it :)\n\n* **Can I be late?**\n\nPlease don't be! We do have a 15 minute grace period where we allow people to funnel in while we hang out, but after that if you arrive too late, it disrupts the flow of the conversation.\n\n* **Where do you meet?**\n\nThe location is posted in Meetup and our [Whatsapp](https://chat.whatsapp.com/EJheHcDboEJ2TKV9wa3omB)[ ](https://chat.whatsapp.com/EK5pxIwMqfcLaWwSSim8TJ)group for this location. It is HIGHLY RECOMMENDED that you join the Whatsapp group! If you want to know what other cities have a Practical Philosophy Club, you can see our chapters on our [website](https://www.practicalphilosophy.club/practical-philosophy-locations/).\n\n**PRACTICAL PHILOSOPHY CLUB - Philosophy, everywhere. ✨**\n\nWe started in Practical Philosophy back in 2021 and there are now 70+ chapters in over 25 countries, including Canada, Spain, Japan, Mexico and many more! 🗺️\n**\\*\\*\\***\n**Join our [Whatsapp group](https://chat.whatsapp.com/EJheHcDboEJ2TKV9wa3omB) 👈**\n**Follow us on [Instagram](https://www.instagram.com/practicalphilosophyclub/) 👈**\n**Our [website](https://www.practicalphilosophy.club/) 👈**","startDate":"2026-10-16T16:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Maison Kayser Turkey","address":{"@type":"PostalAddress","addressLocality":"Istanbul","addressRegion":"","addressCountry":"tr","streetAddress":"Istanbul Oasis, Al Khaleej St, Istanbul, Turkey, Istanbul"}},"organizer":{"@type":"Organization","name":"Practical Philosophy Club - Istanbul, Turkey 🇶🇦","url":"https://www.meetup.com/practical-philosophy-club-istanbul-turkey/"},"performer":"Practical Philosophy Club - Istanbul, Turkey 🇶🇦"},{"@context":"https://schema.org","@type":"Event","name":"Trading Psychology: Build Better Habits with AI","url":"https://www.meetup.com/dubai-ai-trading/events/316764169/","description":"**💬 Join our WhatsApp community to connect with the team, ask questions and share your learning journey.**\n\n**👉 Join the WhatsApp group**\n\n**What if understanding your habits mattered as much as understanding the market?**\n\nJoin Dubai AI Trading for an interactive session exploring trading psychology and how AI can help you reflect on your decisions, organize a trading journal and build a more consistent routine.\n\n**What we’ll explore:**\n• Recognizing FOMO, overconfidence and impulsive decisions.\n• Using AI to create journaling prompts and review your observations.\n• Building a simple checklist to encourage patience and discipline.\n• Understanding AI’s limitations and keeping your own judgement central.\n\nBring your questions, share your experiences and connect with others interested in trading, technology and personal development.\nBeginners and experienced participants are welcome.\n\nContinue the conversation in our optional WhatsApp group to exchange learning resources and ideas with fellow members.\n\n*For educational discussion only, not personalized investment advice. Trading involves risk, including loss of capital. AI can produce inaccurate information and does not guarantee better results.*","startDate":"2026-10-22T19:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-2-square.webp","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.meetup.com/dubai-ai-trading/events/316764169/"},"organizer":{"@type":"Organization","name":"Dubai Ai Trading","url":"https://www.meetup.com/dubai-ai-trading/"},"performer":"Dubai Ai Trading"},{"@context":"https://schema.org","@type":"Event","name":"Language Exchange + Chocolate Tasting (Limited Edition)","url":"https://www.meetup.com/spice-up-international-istanbul/events/316963246/","description":"**This is a free social event for our regular members.** Come for a friendly chat, cultural sharing, and good company! This particular event with chocolate is a limited edition and only happens once in a blue moon (usually when the organiser brings back chocolate from her trips)!\n\n**📍** **Location:** **Old Cafe near Souq Waqif**\n\n**Agenda:**\n**1️⃣ First 30 mins** – *Chocolate Tasting* (flavours from Cyprus, Belarus, Kazakhstan, Tunisia that can blow your mind). You can also bring your nice piece of chocolate that cannot be bought in Istanbul to share with us\n**2️⃣ Next 30 mins –** *Sociable mingling* ✨\n**3️⃣ Second hour –** *Language Exchange*\n\nChocolate Tasting: Minimum 10 QAR cash as a donation to support local community, the food for strays and future chocolate would be highly appreciated.\n\n**Languages 👂💬:** English, Arabic, Spanish, Chinese (and more, depending on attendees)\n**Topic of the day 🗣:** *A chocolate-related memory*\n\nWe have certified Chinese and English teachers with us, who also speak Spanish and Japanese. We especially welcome Arabic speakers, or anyone who just wants to practise languages or make new connections.\n\n✨ Each week we pick a new spot. This time it’s a cute mediterranean café in the quiet corner of Souq Waqif. They have very nice Turkish tea that would go well with our chocolate. Participants will rotate tables by language pairs throughout the session.\n\n💡 If you’ve brought chocolate from abroad that can’t be found in Istanbul, let us know-we’d love to add it to the tasting! As always, to support local businesses, participants cover their own drinks and any extras.","startDate":"2026-10-16T12:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-4-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Old Cafe","address":{"@type":"PostalAddress","addressLocality":"Istanbul","addressRegion":"","addressCountry":"TR","streetAddress":"Ibn Malik St, Istanbul, Istanbul"}},"organizer":{"@type":"Organization","name":"Spice Up International-Istanbul","url":"https://www.meetup.com/spice-up-international-istanbul/"},"performer":"Spice Up International-Istanbul"},{"@context":"https://schema.org","@type":"Event","name":"(CS)²AI Online™ Seminar: Cybersecurity Vulnerability Reporting & Remediation","url":"https://www.meetup.com/istanbul-cyber-security-for-control-systems/events/316909539/","description":"Last year Billy and his team hacked a connected wheelchair and sent it careening down a flight of stairs.\n\nRecently the manufacturer issued a patch to its customers that addresses the authentication and encryption weaknesses we exploited. The update has received 510(k) clearance from the FDA, and the patch is cleared for installation on devices. Thus, the circle is complete, the bugs are no more, and the issues we found have been mitigated. The time between public notification and patch release to the public was about 90 days. These 90 days include coordination for public notification, firmware development work, firmware testing, and the FDA’s 510(k) process.\n\nFor those interested in the behind-the-scenes process of vulnerability discovery, reporting a nts are open for direct funding support.\n\n© Control System Cyber Security Association International 2026","startDate":"2026-10-21T17:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.meetup.com/istanbul-cyber-security-for-control-systems/events/316909539/"},"organizer":{"@type":"Organization","name":"Istanbul Cyber Security for Control Systems","url":"https://www.meetup.com/istanbul-cyber-security-for-control-systems/"},"performer":"Istanbul Cyber Security for Control Systems"},{"@context":"https://schema.org","@type":"Event","name":"🌏🎤 Travel Talk & Karaoke Night 🍜✨","url":"https://www.meetup.com/turkey-meetup-group/events/316892641/","description":"Join us for an evening of travel stories, cultural exchange, delicious food, and karaoke fun!\n\n📅 **Date:** Monday, 19 October 2026\n🕡 **Time:** 7 PM onwards\n📍 **Venue:** Shan Tofu Myanmar Restaurant (Basement)\n[https://maps.app.goo.gl/uSAdB9b5G3sHdPCn7](https://maps.app.goo.gl/uSAdB9b5G3sHdPCn7)\n\n🤝 **In collaboration with Couchsurfing Istanbul Community**\n\n## 🌏 Travel Talk: Exploring Namibia, Botswana and Zimbabwe\n\nTo kick off the evening, one of our member will be sharing highlights and practical tips from his recent journey to Namibia, Botswana and Zimbabwe.\nWhether you're planning a trip to these places, have visited before, or simply enjoy hearing travel stories, everyone is welcome to join the discussion.\n\n## 🍜 Dinner & Socializing\n\nEnjoy authentic Myanmar cuisine while meeting fellow travelers, Couchsurfers, expats, and locals in a relaxed and friendly atmosphere.\n💰 Pay for your own food and drinks\n\n## 🎤 Karaoke Session\n\nAfter the travel talk, we'll continue the evening with karaoke!\nSing your favorite songs, perform a duet, or simply enjoy the music and cheer on others. No singing ept\n• Ways to create content without spending hours doing it manually\n• How automation can simplify everyday business tasks\n• Using AI to improve marketing and customer communication\n• Digital products and online learning opportunities\n• How different AI tools can work together\n• Ways to create more efficient systems as your business grows\n\n### 🚀 Why Attend?\n\nYou don't need to be a technology expert or experienced entrepreneur.\nWhether you’re thinking about starting something of your own, exploring a side project, or already running an online business, this session can help you see how AI may fit into your plans.\nYou’ll leave with new ideas, practical insights, and a clearer picture of what is possible in today’s digital business environment.\n\n### 👤 Who Should Join?\n\nThis event is ideal for:\n• Aspiring entrepreneurs\n• Freelancers and creators\n• Professionals exploring online opportunities\n• Small-business owners\n• People interested in AI and emerging technology\n• Anyone with a business idea they want to explore\n**No previous AI or business experience is required.**\n\n### 🎥 Can't Make It Live?\n\nRegister anyway and check for any replay or follow-up information provided by the organizers.\n\n### Important Information\n\nThis event is educational and informational. It does not provide financial, investment, legal, or professional advice, and no specific income or business results are guaranteed.\n**Free to attend. Come curious, bring your ideas, and discover what's possible.**","startDate":"2026-10-19T19:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-4-square.webp","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.meetup.com/istanbul-rewire-for-success/events/316895609/"},"organizer":{"@type":"Organization","name":"Istanbul Rewire for Success!","url":"https://www.meetup.com/istanbul-rewire-for-s
